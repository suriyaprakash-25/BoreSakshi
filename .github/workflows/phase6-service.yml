name: Phase 6 ML Service

on:
  pull_request:
    paths:
      - "ml/**"
      - "server/index.js"
      - "server/predict.js"
      - "server/mlClient.js"
      - "server/test/mlClient.test.js"
      - "server/test/predictPhase6.test.js"
      - "server/package.json"
      - "web/src/components/PredictionPanel.jsx"
      - ".github/workflows/phase6-service.yml"
  push:
    branches:
      - "phase-6-python-ml-service"
    paths:
      - "ml/**"
      - "server/index.js"
      - "server/predict.js"
      - "server/mlClient.js"
      - "server/test/**"
      - "web/src/components/PredictionPanel.jsx"
      - ".github/workflows/phase6-service.yml"

jobs:
  python-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt
      - name: Install ML service dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Run Phase 4-6 Python tests
        working-directory: ml
        run: python -m pytest -q

  node-orchestration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Syntax-check Phase 6 Node integration
        run: |
          node --check server/mlClient.js
          node --check server/predict.js
          node --check server/index.js
      - name: Run Phase 6 Node tests
        working-directory: server
        run: npm run test:phase6

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build farmer UI
        working-directory: web
        run: npm run build
