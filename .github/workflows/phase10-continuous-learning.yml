name: Phase 10 Continuous Learning

on:
  pull_request:
    paths:
      - "ml/**"
      - "server/**"
      - "web/**"
      - "docs/phase-10-*.md"
      - ".github/workflows/phase10-continuous-learning.yml"
  push:
    branches:
      - "phase-10-continuous-learning"

jobs:
  adaptive-retraining-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        working-directory: ml
        run: python -m pip install -r requirements.txt
      - name: Syntax-check Phase 10 pipeline
        working-directory: ml
        run: |
          python -m py_compile continuous.py
          python -m py_compile boresakshi_ml/continuous.py
          python -m py_compile service.py
      - name: Run Phase 10 tests
        working-directory: ml
        run: python -m pytest -q tests/test_phase10.py
      - name: Run inherited Phase 4-7 ML tests
        working-directory: ml
        run: python -m pytest -q tests/test_phase4.py tests/test_phase5.py tests/test_phase6.py tests/test_phase7.py

  node-contract-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run Phase 7 prediction contract tests
        working-directory: server
        run: npm run test:phase7
      - name: Run Phase 9 verification regressions
        working-directory: server
        run: npm run test:phase9

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web app
        working-directory: web
        run: npm run build
