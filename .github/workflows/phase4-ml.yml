name: Phase 4 ML

on:
  pull_request:
    paths:
      - "ml/**"
      - "server/featurePipeline.js"
      - "server/test/featurePipeline.test.js"
      - "server/geospatial.js"
      - ".github/workflows/phase4-ml.yml"
  push:
    branches:
      - "phase-4-real-ml-model"
    paths:
      - "ml/**"
      - "server/featurePipeline.js"
      - "server/test/featurePipeline.test.js"
      - "server/geospatial.js"
      - ".github/workflows/phase4-ml.yml"

jobs:
  python-ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt
      - name: Install core ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Run Phase 4 tests
        working-directory: ml
        run: python -m pytest -q

  feature-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Phase 3 feature contract syntax
        run: |
          node --check server/featurePipeline.js
          node --check server/geospatial.js
      - name: Run Phase 3/4 feature contract tests
        working-directory: server
        run: node --test test/geospatial.test.js test/featurePipeline.test.js
