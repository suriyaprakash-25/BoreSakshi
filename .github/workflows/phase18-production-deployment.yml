name: Phase 18 Production Deployment

on:
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "ml/**"
      - "deploy/**"
      - "docs/phase-18-*.md"
      - ".github/workflows/phase18-production-deployment.yml"
      - "README.md"
  push:
    branches:
      - main
      - phase-18-production-deployment
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: phase18-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/boresakshi

jobs:
  application-release-tests:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: phase18-ci-jwt-secret-at-least-32-characters-long
      RIG_EVIDENCE_SECRET: phase18-ci-evidence-secret-distinct-and-long-enough
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Syntax check Phase 18 runtime, migrations and scripts
        run: |
          node --check server/productionConfig.js
          node --check server/scripts/production-preflight.js
          node --check server/migrations/runner.js
          node --check server/migrations/phase18-production-v1.js
          bash -n deploy/scripts/release.sh
          bash -n deploy/scripts/smoke-test.sh
          bash -n deploy/scripts/backup-offsite.sh
      - name: Run complete backend regression suite
        working-directory: server
        run: npm run test:phase17
      - name: Run Phase 18 production contract tests explicitly
        working-directory: server
        run: npm run test:phase18
      - name: Audit production server dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  frontend-release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run Phase 17 frontend regression suite
        working-directory: web
        run: npm run test:phase17
      - name: Build same-origin production web bundle
        working-directory: web
        env:
          VITE_API_URL: ""
        run: npm run build
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  ml-release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        working-directory: ml
        run: python -m pip install -r requirements.txt
      - name: Check Python dependency consistency
        working-directory: ml
        run: python -m pip check
      - name: Run complete ML regression suite
        working-directory: ml
        run: python -m pytest -q tests
      - name: Compile Phase 18 ML preflight
        working-directory: ml
        run: python -m py_compile production_preflight.py service.py

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare non-secret compose validation inputs
        run: |
          mkdir -p /tmp/boresakshi-artifacts deploy/secrets
          printf 'phase18-ci-monitoring-token\n' > deploy/secrets/monitoring_token
          cp deploy/env/production.server.env.example /tmp/phase18-server.env
          cp deploy/env/production.ml.env.example /tmp/phase18-ml.env
      - name: Validate production Compose topology
        env:
          RELEASE_VERSION: ci-${{ github.sha }}
          MODEL_ARTIFACT_DIR: /tmp/boresakshi-artifacts
          SERVER_ENV_FILE: /tmp/phase18-server.env
          ML_ENV_FILE: /tmp/phase18-ml.env
          GRAFANA_ADMIN_PASSWORD: phase18-ci-grafana-password
          ALERTMANAGER_CONFIG_FILE: ${{ github.workspace }}/deploy/monitoring/alertmanager.yml.example
          MONITORING_TOKEN_FILE: ${{ github.workspace }}/deploy/secrets/monitoring_token
        run: |
          docker compose -f deploy/compose.production.yml config --quiet
          docker compose -f deploy/compose.production.yml -f deploy/compose.observability.yml --profile observability config --quiet
      - name: Validate staging override topology
        env:
          RELEASE_VERSION: ci-${{ github.sha }}
          MODEL_ARTIFACT_DIR: /tmp/boresakshi-artifacts
          SERVER_ENV_FILE: /tmp/phase18-server.env
          ML_ENV_FILE: /tmp/phase18-ml.env
        run: docker compose -f deploy/compose.production.yml -f deploy/compose.staging.yml config --quiet

  container-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: server
            dockerfile: server/Dockerfile
          - component: ml
            context: ml
            dockerfile: ml/Dockerfile
          - component: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.component }} production image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: false
          load: true
          tags: boresakshi-${{ matrix.component }}:phase18-ci
          build-args: |
            VITE_API_URL=
          cache-from: type=gha,scope=phase18-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=phase18-${{ matrix.component }}
      - name: Inspect non-root image metadata
        run: |
          docker image inspect boresakshi-${{ matrix.component }}:phase18-ci >/tmp/image.json
          test -s /tmp/image.json

  phase18-release-gate:
    runs-on: ubuntu-latest
    needs:
      - application-release-tests
      - frontend-release-tests
      - ml-release-tests
      - deployment-contract
      - container-build
    steps:
      - run: echo "BoreSakshi Phase 18 source, tests, container builds and deployment contracts passed."

  publish-images:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'YES'
    needs: phase18-release-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            context: server
            dockerfile: server/Dockerfile
          - component: ml
            context: ml
            dockerfile: ml/Dockerfile
          - component: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=
          cache-from: type=gha,scope=phase18-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=phase18-${{ matrix.component }}

  deploy-staging:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'YES'
    needs: publish-images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - name: Configure trusted SSH host
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy deployment bundle
        run: |
          tar -czf /tmp/boresakshi-deploy.tgz deploy
          scp /tmp/boresakshi-deploy.tgz "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/tmp/boresakshi-deploy.tgz"
      - name: Authenticate host to GHCR and deploy staging
        env:
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          printf '%s' "${{ secrets.GHCR_DEPLOY_TOKEN }}" | ssh "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" "docker login ghcr.io -u '${{ secrets.GHCR_DEPLOY_USER }}' --password-stdin"
          ssh "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" "set -euo pipefail; mkdir -p '${{ secrets.STAGING_DEPLOY_PATH }}'; tar -xzf /tmp/boresakshi-deploy.tgz -C '${{ secrets.STAGING_DEPLOY_PATH }}'; cd '${{ secrets.STAGING_DEPLOY_PATH }}'; set -a; source /etc/boresakshi/deploy.env; set +a; RELEASE_VERSION='$RELEASE_VERSION' IMAGE_PREFIX='${{ env.IMAGE_PREFIX }}' DEPLOYMENT_ENV=staging bash deploy/scripts/release.sh deploy"
      - name: Independent external staging smoke test
        env:
          DEPLOY_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: bash deploy/scripts/smoke-test.sh "$DEPLOY_BASE_URL"

  deploy-production:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'YES'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Configure trusted SSH host
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy deployment bundle
        run: |
          tar -czf /tmp/boresakshi-deploy.tgz deploy
          scp /tmp/boresakshi-deploy.tgz "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}:/tmp/boresakshi-deploy.tgz"
      - name: Authenticate host to GHCR and deploy approved production release
        env:
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          printf '%s' "${{ secrets.GHCR_DEPLOY_TOKEN }}" | ssh "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" "docker login ghcr.io -u '${{ secrets.GHCR_DEPLOY_USER }}' --password-stdin"
          ssh "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}" "set -euo pipefail; mkdir -p '${{ secrets.PRODUCTION_DEPLOY_PATH }}'; tar -xzf /tmp/boresakshi-deploy.tgz -C '${{ secrets.PRODUCTION_DEPLOY_PATH }}'; cd '${{ secrets.PRODUCTION_DEPLOY_PATH }}'; set -a; source /etc/boresakshi/deploy.env; set +a; RELEASE_VERSION='$RELEASE_VERSION' IMAGE_PREFIX='${{ env.IMAGE_PREFIX }}' DEPLOYMENT_ENV=production bash deploy/scripts/release.sh deploy"
      - name: Independent external production smoke test
        env:
          DEPLOY_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: bash deploy/scripts/smoke-test.sh "$DEPLOY_BASE_URL"
