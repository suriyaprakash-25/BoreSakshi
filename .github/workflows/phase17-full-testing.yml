name: Phase 17 Full Testing

on:
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "ml/**"
      - "docs/phase-17-*.md"
      - ".github/workflows/phase17-full-testing.yml"
  push:
    branches:
      - "phase-17-complete-testing"

jobs:
  backend-full-suite:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: phase17-ci-jwt-secret-at-least-32-characters-long
      RIG_EVIDENCE_SECRET: phase17-ci-evidence-secret-distinct-and-long-enough
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Syntax check server runtime and Phase 17 E2E
        run: |
          node --check server/index.js
          node --check server/auth.js
          node --check server/phase15Routes.js
          node --check server/phase11Routes.js
          node --check server/phase9Routes.js
          node --check server/phase8Routes.js
          node --check server/test/phase17-e2e.test.js
      - name: Run complete backend unit and API integration suite
        working-directory: server
        run: npm run test:phase17
      - name: Audit production server dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  backend-real-mongo-e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PHASE17_E2E: YES
      PHASE17_MONGODB_URI: mongodb://127.0.0.1:27017/
      JWT_SECRET: phase17-parent-test-secret-at-least-32-characters-long
      RIG_EVIDENCE_SECRET: phase17-parent-evidence-secret-distinct-and-long-enough
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run real database end-to-end lifecycle
        working-directory: server
        run: npm run test:phase17:e2e

  frontend-component-and-flow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run component, form, map and auth-flow tests
        working-directory: web
        run: npm run test:phase17
      - name: Build production frontend
        working-directory: web
        run: npm run build
      - name: Smoke test production preview
        working-directory: web
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/boresakshi-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/boresakshi-index.html; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1" || { cat /tmp/boresakshi-preview.log; exit 1; }
          grep -q '<div id="root"></div>' /tmp/boresakshi-index.html
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  ml-full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        working-directory: ml
        run: python -m pip install -r requirements.txt
      - name: Validate installed Python environment
        working-directory: ml
        run: python -m pip check
      - name: Run complete ML feature/data/inference/evaluation/leakage suite
        working-directory: ml
        run: python -m pytest -q tests

  phase17-release-gate:
    runs-on: ubuntu-latest
    needs:
      - backend-full-suite
      - backend-real-mongo-e2e
      - frontend-component-and-flow-tests
      - ml-full-regression
    steps:
      - name: Phase 17 release test gate
        run: echo "All BoreSakshi Phase 17 release test layers passed."
