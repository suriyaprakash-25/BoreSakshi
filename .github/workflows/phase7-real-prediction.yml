name: Phase 7 Real Prediction Engine

on:
  pull_request:
    paths:
      - "ml/**"
      - "server/predict.js"
      - "server/predictionContract.js"
      - "server/test/**"
      - "server/package.json"
      - "web/**"
      - ".github/workflows/phase7-real-prediction.yml"
  push:
    branches:
      - "phase-7-real-prediction-activation"

jobs:
  python-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt
      - name: Install ML service dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Run Phase 4-7 Python tests
        working-directory: ml
        run: python -m pytest -q

  node-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Syntax-check prediction path
        run: |
          node --check server/predictionContract.js
          node --check server/predict.js
          node --check server/mlClient.js
          node --check server/index.js
      - name: Run Phase 6-7 prediction integration tests
        working-directory: server
        run: npm run test:phase7

  frontend-contract-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build existing farmer frontend against additive contract
        working-directory: web
        run: npm run build
