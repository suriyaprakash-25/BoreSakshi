name: Phase 5 Scientific Evaluation

on:
  pull_request:
    paths:
      - "ml/**"
      - "server/featurePipeline.js"
      - ".github/workflows/phase5-evaluation.yml"
  push:
    branches:
      - "phase-5-scientific-evaluation"
    paths:
      - "ml/**"
      - "server/featurePipeline.js"
      - ".github/workflows/phase5-evaluation.yml"

jobs:
  scientific-evaluation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Run Phase 4 and Phase 5 Python tests
        working-directory: ml
        run: python -m pytest -q
