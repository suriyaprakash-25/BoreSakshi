name: Phase 15 Production Security and Reliability

on:
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "docs/phase-15-*.md"
      - ".github/workflows/phase15-production-security.yml"
  push:
    branches:
      - "phase-15-production-security-reliability"

jobs:
  server-security-tests:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: phase15-ci-jwt-secret-at-least-32-characters-long
      RIG_EVIDENCE_SECRET: phase15-ci-evidence-secret-distinct-and-long-enough
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Syntax-check Phase 15 security path
        run: |
          node --check server/security.js
          node --check server/observability.js
          node --check server/backupCore.js
          node --check server/authStore.js
          node --check server/auth.js
          node --check server/phase15Routes.js
          node --check server/phase11Routes.js
          node --check server/middleware.js
          node --check server/scripts/backup.js
          node --check server/scripts/verify-backup.js
          node --check server/scripts/restore-backup.js
      - name: Run Phase 15 tests
        working-directory: server
        run: npm run test:phase15
      - name: Run inherited Phase 7-11 regressions
        working-directory: server
        run: |
          npm run test:phase7
          npm run test:phase8
          npm run test:phase9
          npm run test:phase11
      - name: Audit production server dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  web-security-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  ml-security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        working-directory: ml
        run: python -m pip install -r requirements.txt
      - name: Run serving and continuous-learning security regressions
        working-directory: ml
        run: python -m pytest -q tests/test_phase6.py tests/test_phase7.py tests/test_phase10.py
