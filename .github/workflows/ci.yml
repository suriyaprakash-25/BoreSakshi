name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Server regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      RIG_EVIDENCE_SECRET: ci-only-evidence-secret-distinct-and-long-enough
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Check final server syntax
        run: |
          node --check server/index.js
          node --check server/auth.js
          node --check server/phase8Routes.js
          node --check server/phase9Routes.js
          node --check server/phase11Routes.js
          node --check server/phase15Routes.js
          node --check server/production.js
          node --check server/productionConfig.js
      - name: Run complete backend regression suite
        working-directory: server
        run: npm run test:phase17
      - name: Audit production server dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web regression and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend regression suite
        working-directory: web
        run: npm run test:phase17
      - name: Build production web bundle
        working-directory: web
        env:
          VITE_API_URL: ""
        run: npm run build
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
