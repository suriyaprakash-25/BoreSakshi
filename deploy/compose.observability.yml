services:
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - monitoring_token
    networks:
      - internal
      - observability
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - "${ALERTMANAGER_CONFIG_FILE:-./monitoring/alertmanager.yml.example}:/etc/alertmanager/alertmanager.yml:ro"
      - alertmanager_data:/alertmanager
    networks:
      - observability

  loki:
    image: grafana/loki:3.7.2
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - observability

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:5.1.3
    restart: unless-stopped
    profiles: ["observability"]
    user: "0:0"
    volumes:
      - ./monitoring/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - observability
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "${OBSERVABILITY_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks:
      - observability
    depends_on:
      - prometheus
      - loki

networks:
  observability:

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:

secrets:
  monitoring_token:
    file: "${MONITORING_TOKEN_FILE:-./secrets/monitoring_token}"
