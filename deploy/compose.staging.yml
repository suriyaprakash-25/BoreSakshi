services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--quiet"]
    volumes:
      - staging_mongo:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    environment:
      DEPLOYMENT_ENV: staging
      MONGODB_URI: mongodb://mongo:27017/
      MONGODB_DB: BoreSakshiStaging
    depends_on:
      mongo:
        condition: service_healthy
      ml:
        condition: service_healthy

volumes:
  staging_mongo:
    name: boresakshi_staging_mongo
