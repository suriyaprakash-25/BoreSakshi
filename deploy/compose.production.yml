name: boresakshi

services:
  ml:
    image: "${IMAGE_PREFIX:-ghcr.io/suriyaprakash-25/boresakshi}-ml:${RELEASE_VERSION}"
    restart: unless-stopped
    env_file:
      - "${ML_ENV_FILE:-./env/production.ml.env}"
    environment:
      DEPLOYMENT_ENV: "${DEPLOYMENT_ENV:-production}"
      RELEASE_VERSION: "${RELEASE_VERSION}"
      PORT: "8000"
    volumes:
      - "${MODEL_ARTIFACT_DIR}:/opt/boresakshi/artifacts:ro"
    expose:
      - "8000"
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: "${ML_MEMORY_LIMIT:-4g}"
    cpus: "${ML_CPU_LIMIT:-2.0}"
    stop_grace_period: 30s

  api:
    image: "${IMAGE_PREFIX:-ghcr.io/suriyaprakash-25/boresakshi}-api:${RELEASE_VERSION}"
    restart: unless-stopped
    env_file:
      - "${SERVER_ENV_FILE:-./env/production.server.env}"
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: "${DEPLOYMENT_ENV:-production}"
      RELEASE_VERSION: "${RELEASE_VERSION}"
      PORT: "4000"
      ML_SERVICE_URL: "http://ml:8000"
      RIG_MEDIA_DIR: "/var/lib/boresakshi/rig-media"
      BACKUP_DIR: "/var/lib/boresakshi/backups"
    depends_on:
      ml:
        condition: service_healthy
    volumes:
      - rig_media:/var/lib/boresakshi/rig-media
      - backups:/var/lib/boresakshi/backups
    expose:
      - "4000"
    networks:
      - internal
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: "${API_MEMORY_LIMIT:-1g}"
    cpus: "${API_CPU_LIMIT:-1.0}"
    stop_grace_period: 30s

  web:
    image: "${IMAGE_PREFIX:-ghcr.io/suriyaprakash-25/boresakshi}-web:${RELEASE_VERSION}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${WEB_MEMORY_LIMIT:-256m}"
    cpus: "${WEB_CPU_LIMIT:-0.5}"
    stop_grace_period: 20s

networks:
  edge:
  internal:
    internal: true

volumes:
  rig_media:
    external: true
    name: "${RIG_MEDIA_VOLUME:-boresakshi_rig_media}"
  backups:
    external: true
    name: "${BACKUP_VOLUME:-boresakshi_backups}"
